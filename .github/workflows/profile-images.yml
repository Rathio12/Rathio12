name: Generate profile images

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Activity graph (generated locally, no hosted service)
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          bg_color: 0a0612
          color: e9d5ff
          line: a855f7
          point: f3e8ff
          area: true
          area_color: 7c3aed
          hide_border: true
          title_color: c084fc
          radius: 8

      - name: Trophies (downloaded with retries, optional)
        continue-on-error: true
        run: |
          mkdir -p dist
          URL="https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=dracula&no-frame=true&no-bg=true&margin-w=10&margin-h=10&column=7"
          for i in 1 2 3 4 5; do
            curl -fsSL "$URL" -o dist/trophies.svg || true
            if [ -s dist/trophies.svg ] && grep -q "<svg" dist/trophies.svg; then
              echo "Trophies downloaded"; exit 0
            fi
            echo "Attempt $i failed, retrying..."; sleep 20
          done
          rm -f dist/trophies.svg
          echo "Trophies unavailable, skipping"

      - name: Publish to the images branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: images
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}