<svg width="460" height="160" viewBox="0 0 460 160" xmlns="http://www.w3.org/2000/svg">

  <!-- window -->
  <rect x="0" y="0" width="460" height="160" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="460" height="32" rx="10" fill="#161b22"/>
  <rect x="0" y="22" width="460" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="230" y="20" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b949e">neon@rey: ~</text>

  <!-- prompt -->
  <text x="20" y="65" font-family="Menlo, Consolas, monospace" font-size="16" fill="#58a6ff">$ <tspan fill="#c9d1d9">whoami</tspan></text>

  <!-- typed output, fades in after a short delay -->
  <text x="20" y="105" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#39ff14" letter-spacing="6" opacity="0">
    R E Y
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- blinking cursor, appears right after the text -->
  <rect x="145" y="82" width="12" height="26" fill="#39ff14" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;1" keyTimes="0;0.01;0.5;0.51;1" begin="0.9s" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
