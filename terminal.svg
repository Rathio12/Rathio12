<svg width="460" height="160" viewBox="0 0 460 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" from="0" to="220" begin="0.6s" dur="1.4s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="460" height="160" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="460" height="32" rx="10" fill="#161b22"/>
  <rect x="0" y="22" width="460" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="230" y="20" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b949e">neon@rey: ~</text>

  <!-- prompt -->
  <text x="20" y="65" font-family="Menlo, Consolas, monospace" font-size="16" fill="#58a6ff">$ <tspan fill="#c9d1d9">whoami</tspan></text>

  <!-- typed output, revealed via clip-path -->
  <g clip-path="url(#reveal)" transform="translate(20,80)">
    <text x="0" y="20" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#39ff14" letter-spacing="6">R E Y</text>
  </g>

  <!-- blinking cursor, moves into place after typing -->
  <rect x="20" y="88" width="12" height="22" fill="#39ff14">
    <animate attributeName="x" from="20" to="230" begin="0.6s" dur="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2s" repeatCount="indefinite"/>
  </rect>
</svg>
